<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<!--
  Style-Stack — wird in jedem Layout-Head per th:replace eingebunden statt
  dashboard.css direkt zu linken. Das StyleAdvice setzt aktiverStyle als
  Model-Attribut. Zurzeit gibt es nur den Style 'default'; ein Theme-Override
  (überschreibt nur :root-Variablen) würde hier zusätzlich eingebunden.
-->
<th:block th:fragment="styles">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</th:block>

</head>
</html>
