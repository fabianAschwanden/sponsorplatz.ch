<!DOCTYPE html>
<html lang="de-CH"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.rubrik} + ' — ' + #{admin.verifizierungen.titel} + ' — Sponsorplatz'">Admin — Verifizierungen — Sponsorplatz</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <th:block th:replace="~{fragments/styles :: styles}"></th:block>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
</head>
<body class="app-body">

<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: app-sidebar('admin', null)}"></aside>

    <main class="app-main">
        <header class="app-page-head">
            <div>
                <p class="app-page-rubrik" th:text="#{admin.rubrik}">Plattform-Admin</p>
                <h1 th:text="#{admin.verifizierungen.titel}">Verifizierungen</h1>
            </div>
        </header>

        <div th:if="${erfolgsMeldung != null}" class="app-meldung erfolg" th:text="${erfolgsMeldung}"></div>

        <div th:if="${#lists.isEmpty(pendingOrgs)}" class="app-empty">
            <strong>Keine ausstehenden Verifizierungen.</strong>
            Alle eingegangenen Organisationen sind bearbeitet.
        </div>

        <section th:each="org : ${pendingOrgs}" class="app-card" style="margin-bottom: 1rem;">
            <header style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; gap:1rem; flex-wrap:wrap;">
                <div>
                    <h2 style="font-family:var(--dash-font-head); font-size:1.25rem; margin:0 0 0.4rem;" th:text="${org.name}">Org-Name</h2>
                    <span class="app-chip" th:text="${org.typ}">VEREIN</span>
                    <span class="app-muted" th:if="${org.rechtsform}" th:text="' · ' + ${org.rechtsform}"></span>
                </div>
            </header>

            <dl class="app-datenliste">
                <dt>Slug</dt>
                <dd><code th:text="${org.slug}">slug</code></dd>

                <dt>Status</dt>
                <dd>
                    <span class="app-status" th:classappend="${'status-' + #strings.toLowerCase(org.status)}"
                          th:text="${org.status}">PENDING</span>
                </dd>

                <th:block th:if="${org.branche}">
                    <dt>Branche</dt>
                    <dd>
                        <span class="app-chip app-chip-health" th:text="${org.branche.anzeige}">Sport</span>
                    </dd>
                </th:block>

                <th:block th:if="${org.websiteUrl}">
                    <dt>Website</dt>
                    <dd>
                        <a th:href="${org.websiteUrl}" target="_blank" rel="noopener" th:text="${org.websiteUrl}"></a>
                    </dd>
                </th:block>

                <th:block th:if="${org.beschreibung}">
                    <dt>Beschreibung</dt>
                    <dd th:text="${org.beschreibung}"></dd>
                </th:block>

                <dt>Registriert</dt>
                <dd th:text="${#temporals.format(org.registriertAm, 'dd.MM.yyyy HH:mm')}">01.01.2026</dd>
            </dl>

            <form th:action="@{/admin/verifizierungen/{id}/entscheid(id=${org.id})}" method="post">
                <fieldset>
                    <legend th:text="#{admin.verifizierungen.pruefpunkt.sport}">Bezug zu Sport oder Gesundheit</legend>
                    <label><input type="radio" name="sportOderGesundheit" value="true" required>
                        <span th:text="#{admin.verifizierungen.ja}">Ja</span></label>
                    <label><input type="radio" name="sportOderGesundheit" value="false" required>
                        <span th:text="#{admin.verifizierungen.nein}">Nein</span></label>
                </fieldset>
                <fieldset>
                    <legend th:text="#{admin.verifizierungen.pruefpunkt.schweiz}">Bezug zur Schweiz</legend>
                    <label><input type="radio" name="bezugZurSchweiz" value="true" required>
                        <span th:text="#{admin.verifizierungen.ja}">Ja</span></label>
                    <label><input type="radio" name="bezugZurSchweiz" value="false" required>
                        <span th:text="#{admin.verifizierungen.nein}">Nein</span></label>
                </fieldset>
                <fieldset>
                    <legend th:text="#{admin.verifizierungen.pruefpunkt.plausibel}">Angaben sind plausibel</legend>
                    <label><input type="radio" name="angabenPlausibel" value="true" required>
                        <span th:text="#{admin.verifizierungen.ja}">Ja</span></label>
                    <label><input type="radio" name="angabenPlausibel" value="false" required>
                        <span th:text="#{admin.verifizierungen.nein}">Nein</span></label>
                </fieldset>
                <label for="ablehnungsgrund" th:text="#{admin.verifizierungen.ablehnungsgrund}">
                    Grund bei Ablehnung
                </label>
                <textarea id="ablehnungsgrund" name="grund" rows="3"
                          th:placeholder="#{admin.verifizierungen.ablehnungsgrund.placeholder}"></textarea>
                <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                    <button type="submit" name="entscheidung" value="VERIFIZIEREN"
                            class="app-btn" th:text="#{admin.verifizierungen.freigeben}">
                        Prüfen und freigeben
                    </button>
                    <button type="submit" name="entscheidung" value="ABLEHNEN"
                            class="app-btn app-btn-danger" th:text="#{admin.verifizierungen.ablehnen}">
                        Ablehnen
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<th:block th:replace="~{fragments/sentry-browser :: sentry-script}"></th:block>
</body>
</html>
