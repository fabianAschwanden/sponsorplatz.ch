# Architektur-Diagramme: prüft docs/architektur/workspace.dsl und dass die Diagramme unter
# docs/architektur/diagramme/ dazu passen.
#
# Der Workflow schreibt nichts ins Repo. Früher committete er die Diagramme nach dem Merge selbst auf main; das
# umgeht die Regel «main nur über PR» und scheitert am Branch-Schutz. Wer workspace.dsl ändert, rendert lokal
# (docs/architektur/README.md) und committet die Diagramme im selben PR.
#
# Structurizr CLI läuft ohne Netz: workspace.dsl lädt kein externes Theme mehr (static.structurizr.com ist nicht mehr
# erreichbar, daran scheiterte der Workflow am 26.11.2026).
name: Architektur-Diagramme

on:
  push:
    branches: [main]
    paths:
      - 'docs/architektur/workspace.dsl'
      - 'docs/architektur/diagramme/**'
      - '.github/workflows/architektur-diagramme.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/architektur/workspace.dsl'
      - 'docs/architektur/diagramme/**'
      - '.github/workflows/architektur-diagramme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: DSL prüfen, Diagramme aktuell
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    env:
      CLI_VERSION: v2024.12.07
      CLI_SHA256: 3c22f0820f92496514030e7e99af234cac710ade373f157dd3dc8abe3bc7af37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Structurizr CLI laden und prüfen
        run: |
          mkdir -p "$RUNNER_TEMP/structurizr" && cd "$RUNNER_TEMP/structurizr"
          curl -sSfL -o cli.zip "https://github.com/structurizr/cli/releases/download/${CLI_VERSION}/structurizr-cli.zip"
          echo "${CLI_SHA256}  cli.zip" | sha256sum -c -
          unzip -q cli.zip
      - name: workspace.dsl prüfen
        run: |
          "$RUNNER_TEMP/structurizr/structurizr.sh" validate -workspace docs/architektur/workspace.dsl
      - name: Diagramme rendern (Mermaid und PlantUML)
        run: |
          mkdir -p "$RUNNER_TEMP/diagramme"
          for format in mermaid plantuml/structurizr; do
            "$RUNNER_TEMP/structurizr/structurizr.sh" export -workspace docs/architektur/workspace.dsl \
              -format "$format" -output "$RUNNER_TEMP/diagramme"
          done
      - name: Diagramme im Repo sind aktuell
        run: |
          if ! diff -r -x README.md "$RUNNER_TEMP/diagramme" docs/architektur/diagramme; then
            echo "::error::Diagramme passen nicht zu workspace.dsl: lokal neu rendern (docs/architektur/README.md) und committen. Die gerenderten Dateien hängen als Artefakt an diesem Lauf."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: architektur-diagramme-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagramme/
          retention-days: 3
